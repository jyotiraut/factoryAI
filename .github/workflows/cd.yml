name: CD

# Runs after CI passes on main — build → SBOM → image scan → push → deploy to staging →
# smoke tests → a manual gate → production. The manual gate is not a workflow step: it is
# `production`'s own GitHub Environment protection rule (Settings → Environments →
# production → required reviewers), configured once in the repo, not expressible as YAML
# here — `deploy-production` simply won't start running until that approval is granted.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to deploy (defaults to the triggering commit SHA)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-push:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
      repository: ${{ steps.image-ref.outputs.repository }}
      tag: ${{ steps.image-ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: image-ref
        # `${VAR,,}` lowercases `IMAGE_NAME` — never skip this: `github.repository` is
        # "jyotiraut/factoryAI" (this repo's actual case), and every OCI registry requires
        # a lowercase name, so the very first real CD run (CI had never passed before this
        # phase) failed immediately with "invalid tag ... repository name must be
        # lowercase". Also outputs `repository`/`tag` separately, not just the combined
        # `image` ref: the two `helm upgrade --set image.tag=...` calls below were passing
        # the *entire* "registry/name:tag" string as the tag alone — a second bug, from
        # the same never-before-run code, caught by inspection once the first one made it
        # possible to look this far.
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          REPO="${REPO,,}"
          echo "repository=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet — scanned first)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/factoryai.Dockerfile
          tags: ${{ steps.image-ref.outputs.image }}
          load: true
          push: false

      # A HIGH/CRITICAL finding here blocks the pipeline (Phase 14's own exit criterion) —
      # scanning the built image, not just the filesystem `ci.yml`'s own `security` job
      # already covers, since a base-image or installed-package CVE only exists once the
      # image is actually assembled.
      - name: Trivy image scan
        # Was `@0.28.0` — no such tag exists (they're all `v`-prefixed); see ci.yml's
        # identical comment on its own filesystem-scan step for how this was confirmed.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-ref.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image-ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/factoryai.Dockerfile
          tags: ${{ steps.image-ref.outputs.image }}
          push: true

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-scan-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl and Helm
        uses: azure/setup-helm@v4

      # `KUBE_CONFIG_STAGING` (base64-encoded kubeconfig for the staging cluster) is a
      # required repo/environment secret this workflow does not itself provision — this
      # environment has never had a real cluster, so this step is written correctly but
      # never actually run end-to-end; see ADR-0017's "Live verification" for what was and
      # wasn't exercised.
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"

      - name: helm upgrade --install
        run: |
          helm upgrade --install factoryai deploy/helm/factoryai \
            --namespace factoryai-staging --create-namespace \
            -f deploy/helm/factoryai/values-staging.yaml \
            --set image.repository=${{ needs.build-scan-push.outputs.repository }} \
            --set image.tag=${{ needs.build-scan-push.outputs.tag }} \
            --wait --timeout 5m

  smoke-tests:
    name: Smoke test staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"

      - name: Wait for rollout
        run: kubectl rollout status deployment/factoryai-api -n factoryai-staging --timeout=120s

      - name: Hit /health/live and /health/ready through the Service
        run: |
          kubectl run smoke-test --rm -i --restart=Never --image=curlimages/curl -n factoryai-staging -- \
            sh -c "curl -sf http://factoryai-api:8000/health/live && curl -sf http://factoryai-api:8000/health/ready"

  # `deploy-production`'s `environment: production` is what the manual gate actually is —
  # GitHub will not start this job until a required reviewer approves it in the Actions UI,
  # a repo setting (Settings → Environments → production → Required reviewers), not
  # anything this file can express directly.
  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: smoke-tests
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl and Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"

      - name: helm upgrade --install
        run: |
          helm upgrade --install factoryai deploy/helm/factoryai \
            --namespace factoryai --create-namespace \
            -f deploy/helm/factoryai/values-production.yaml \
            --set image.repository=${{ needs.build-scan-push.outputs.repository }} \
            --set image.tag=${{ needs.build-scan-push.outputs.tag }} \
            --wait --timeout 10m
