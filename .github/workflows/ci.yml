name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"   # ADR-0007

jobs:
  quality:
    name: Lint, types and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # Two real bugs, both found on the first CI run anyone actually watched: (1)
        # `--system` alone targets whatever `python3` resolves to on the runner image
        # (Ubuntu 24.04's externally-managed 3.12), never the 3.11 `uv python install`
        # just downloaded — `--python` is what actually selects it; (2) uv's own managed
        # interpreters are themselves externally-managed by default too, so `--system`
        # still refuses the install even pointed at the right Python — a non-issue on a
        # disposable single-purpose runner, hence `--break-system-packages`.
        run: uv pip install --system --python ${{ env.PYTHON_VERSION }} --break-system-packages -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github src tests

      - name: Black
        run: black --check src tests

      - name: Mypy
        run: mypy

      - name: Architecture contracts
        run: lint-imports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # `--system` alone targets whatever `python3` resolves to on the runner image
        # (Ubuntu 24.04 ships an externally-managed 3.12, which then refuses the install
        # outright per PEP 668) — it does NOT pick up the 3.11 `uv python install` just
        # downloaded into uv's own toolchain above. `--python` is what actually selects
        # that interpreter; found live (first real CI run this pipeline ever completed,
        # after months of every push silently failing at this exact step unnoticed).
        run: uv pip install --system --python ${{ env.PYTHON_VERSION }} --break-system-packages -e ".[dev]"

      - name: Run unit tests
        run: pytest -m unit

  # Runs unit and integration tests together, with the 80% coverage gate enabled — see
  # docs/CONTRIBUTING.md for why the gate is not enforced on the unit-only job above.
  # Postgres and MinIO are started on demand by testcontainers; the Docker daemon that
  # ships on ubuntu-latest runners is all this needs.
  integration-tests:
    name: Integration tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # See the `quality` job's identical comment: `--python` is required alongside
        # `--system`, or uv silently falls back to the runner's externally-managed 3.12.
        run: uv pip install --system --python ${{ env.PYTHON_VERSION }} --break-system-packages -e ".[dev,storage,test-infra]"

      - name: Run unit + integration tests with coverage
        run: pytest -m "unit or integration" --cov=factoryai --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-combined
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        # Was `@0.28.0` — no such tag exists (they're all `v`-prefixed, e.g. `v0.28.0`),
        # so this job failed at "resolve action" before a single step ever ran. Found live
        # via `gh api repos/aquasecurity/trivy-action/tags` against the real registry,
        # not guessed; pinned to the newest published tag at the time of this fix.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --verbose "**/*.md"
          fail: true

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, security, docs]
    if: always()
    steps:
      - name: Verify no job failed
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All required jobs succeeded."
