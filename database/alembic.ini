[alembic]
# %(here)s resolves to this file's directory, so `alembic` works regardless of the
# caller's current working directory.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..

# The actual URL is supplied at runtime by env.py from factoryai.shared.config, so that
# migrations and the application read the same settings and never drift. This placeholder
# is only used if env.py is bypassed entirely.
sqlalchemy.url = postgresql+psycopg://factoryai:factoryai@localhost:5432/factoryai

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
