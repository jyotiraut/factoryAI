# Local development stack for FactoryAI (Phase 2: persistence + object storage).
#
# Every published port is parameterised with a default, so a developer whose machine
# already has something bound to the "obvious" port (5432, 9000, ...) can override it in
# their .env without editing this file. Later phases append services here rather than
# replacing this file — see docs/ROADMAP.md.
#
# Usage: make up   (== docker compose -f deploy/compose/docker-compose.yml up -d --build)

name: factoryai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factoryai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factoryai}
      POSTGRES_DB: ${POSTGRES_DB:-factoryai}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factoryai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [factoryai]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${STORAGE_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [factoryai]

  # One-shot job: creates the buckets the platform expects (see
  # factoryai.shared.config.StorageSettings.buckets) and exits. Re-running is safe —
  # `mc mb --ignore-existing` no-ops on a bucket that is already there.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/factoryai-raw &&
      mc mb --ignore-existing local/factoryai-datasets &&
      mc mb --ignore-existing local/factoryai-artifacts &&
      mc mb --ignore-existing local/factoryai-heatmaps
      "
    networks: [factoryai]

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [factoryai]

  # One-shot job: creates the `mlflow` database inside the shared Postgres instance.
  # MLflow's backend store expects a database of its own rather than reusing factoryai's
  # application schema (ADR-0004) — `CREATE DATABASE` cannot run inside a transaction or be
  # made conditional in plain SQL, hence the shell-level existence check.
  mlflow-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-factoryai}
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U ${POSTGRES_USER:-factoryai} -d ${POSTGRES_DB:-factoryai} -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'mlflow'\" | grep -q 1 ||
      psql -h postgres -U ${POSTGRES_USER:-factoryai} -d ${POSTGRES_DB:-factoryai} -c
      \"CREATE DATABASE mlflow\"
      "
    networks: [factoryai]

  # Self-hosted MLflow: PostgreSQL backend store, MinIO (S3-compatible) artifact store
  # (ADR-0004). The image is built locally (see mlflow.Dockerfile) because the upstream
  # MLflow image ships without the Postgres/S3 client libraries the server needs to talk to
  # either.
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-factoryai}:${POSTGRES_PASSWORD:-factoryai}@postgres:5432/mlflow
      --default-artifact-root s3://${STORAGE_BUCKET_ARTIFACTS:-factoryai-artifacts}/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${MLFLOW_HOST_PORT:-5000}:5000"
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [factoryai]

  # Phase 9: broker + result backend for the Celery worker (ADR-0012). DB 1 is the broker,
  # DB 2 the result backend (see CelerySettings) — kept apart so flushing task results
  # never touches messages still in flight, and vice versa.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [factoryai]

  # The worker and Flower are deliberately not containerised here, for the same reason the
  # API itself is not (Phase 7): there is no application image yet — `factoryai serve` and
  # now `factoryai worker` both run against this compose stack from the host, exactly like
  # every other phase's live verification. Building and shipping a real application image
  # is Phase 14 scope (Kubernetes/Helm), not something to half-do in Phase 9's compose file.
  # From the host, once `make up` is running:
  #   factoryai worker --pool=solo               # Windows; --pool=prefork on Linux/macOS
  #   celery -A factoryai.worker.celery_app flower --port=5555
  #
  # Airflow is the one exception to "run from the host" (ADR-0013): unlike the API and the
  # worker, Airflow itself is a third-party application, not something `factoryai` ships an
  # entry point for — there is no host-side equivalent of `factoryai serve` to run it with.
  # It needs an image regardless, so `airflow.Dockerfile` builds one with `factoryai[storage,
  # imaging,versioning,ml]` installed alongside it.

  # One-shot job: creates the `airflow` database inside the shared Postgres instance,
  # mirroring `mlflow-db-init` exactly (ADR-0004's reasoning applies unchanged: Airflow's
  # own metadata store expects a database of its own, not factoryai's application schema).
  airflow-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-factoryai}
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U ${POSTGRES_USER:-factoryai} -d ${POSTGRES_DB:-factoryai} -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'airflow'\" | grep -q 1 ||
      psql -h postgres -U ${POSTGRES_USER:-factoryai} -d ${POSTGRES_DB:-factoryai} -c
      \"CREATE DATABASE airflow\"
      "
    networks: [factoryai]

  # One-shot job: applies Airflow's own metadata schema and creates the local admin
  # account. Both are idempotent by construction (`db migrate` is a no-op on an
  # up-to-date schema; `users create` is guarded so a second `make up` does not fail on
  # "user already exists") — safe to run on every stack start, not just the first.
  airflow-init:
    build:
      context: ../..
      dockerfile: deploy/compose/airflow.Dockerfile
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-factoryai}:${POSTGRES_PASSWORD:-factoryai}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-change-me}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Read by `factoryai` itself inside /opt/factoryai-venv (pipeline_runner), not by
      # Airflow — these are the same POSTGRES_*/STORAGE_*/MLFLOW_* variables the app reads
      # everywhere else (shared/config.py), just set directly rather than via a mounted
      # .env: Airflow's own container environment has no host .env file to read from.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-factoryai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factoryai}
      POSTGRES_DB: ${POSTGRES_DB:-factoryai}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    entrypoint: >
      /bin/bash -c "
      airflow db migrate &&
      (airflow users list | grep -q ${AIRFLOW_ADMIN_USER:-admin} ||
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-change-me-locally}
      --firstname Admin --lastname Admin --role Admin --email admin@factoryai.local)
      "
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    networks: [factoryai]

  airflow-webserver:
    build:
      context: ../..
      dockerfile: deploy/compose/airflow.Dockerfile
    command: webserver
    environment: *airflow-env
    volumes:
      - ../../pipelines/airflow/dags:/opt/airflow/dags
    ports:
      - "${AIRFLOW_HOST_PORT:-8081}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [factoryai]

  airflow-scheduler:
    build:
      context: ../..
      dockerfile: deploy/compose/airflow.Dockerfile
    command: scheduler
    environment: *airflow-env
    volumes:
      - ../../pipelines/airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [factoryai]

  # Phase 11 (ADR-0014): scrapes the API's `/metrics` on the host, exactly the way a
  # developer's browser would (see `prometheus.yml`'s own comment on why — the API is not
  # containerised). `extra_hosts` makes `host.docker.internal` resolve on Linux too; Docker
  # Desktop (Windows/macOS) already provides it without this.
  prometheus:
    image: prom/prometheus:v2.55.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [factoryai]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks: [factoryai]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks: [factoryai]

networks:
  factoryai:
    name: factoryai

volumes:
  postgres-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
