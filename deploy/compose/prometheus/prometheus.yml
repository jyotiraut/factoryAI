# Prometheus configuration for FactoryAI (Phase 11, ADR-0014).
#
# `factoryai-api` scrapes `host.docker.internal`, not a container name: the API and worker
# are deliberately not containerised (Phase 9's decision — there is no application image
# until Phase 14), so they run on the host, and Prometheus (which *is* containerised) has
# to reach out to it the same way a developer's browser does. `docker-compose.yml` adds the
# `host.docker.internal` mapping via `extra_hosts` so this resolves on Linux too, where
# Docker Desktop's automatic mapping doesn't apply.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: factoryai-api
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
