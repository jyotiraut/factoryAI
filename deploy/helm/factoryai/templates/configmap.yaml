# Every non-secret env var `shared/config.py`'s `Settings` reads, computed once here so
# the api/worker Deployments (and any future one) share a single source of truth for
# where Postgres/Redis/MinIO/MLflow actually are, bundled or external.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "factoryai.fullname" . }}-config
  labels:
    {{- include "factoryai.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_CORS_ORIGINS: {{ .Values.config.apiCorsOrigins | quote }}
  POSTGRES_HOST: {{ include "factoryai.postgresHost" . | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.external.port | default 5432 | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  STORAGE_BACKEND: {{ .Values.config.storageBackend | quote }}
  STORAGE_ENDPOINT: {{ include "factoryai.storageEndpoint" . | quote }}
  STORAGE_USE_SSL: {{ .Values.config.storageUseSsl | quote }}
  STORAGE_REGION: {{ .Values.config.storageRegion | quote }}
  MLFLOW_TRACKING_URI: {{ include "factoryai.mlflowUri" . | quote }}
  MLFLOW_S3_ENDPOINT_URL: {{ include "factoryai.storageEndpoint" . | quote }}
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_ACCESS_TOKEN_MINUTES: {{ .Values.config.jwtAccessTokenMinutes | quote }}
  JWT_REFRESH_TOKEN_DAYS: {{ .Values.config.jwtRefreshTokenDays | quote }}
  CELERY_BROKER_URL: "redis://{{ include "factoryai.redisHost" . }}:{{ .Values.redis.external.port | default 6379 }}/1"
  CELERY_RESULT_BACKEND: "redis://{{ include "factoryai.redisHost" . }}:{{ .Values.redis.external.port | default 6379 }}/2"
