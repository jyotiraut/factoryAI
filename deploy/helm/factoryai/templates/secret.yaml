# `values.yaml`'s own defaults here are obvious placeholders ("changeme-..."), not
# realistic-looking fake secrets — a real install overrides every key below via `--set`
# or a values file sourced from a real secrets manager (see `deploy/terraform/modules/
# secrets`), never commits real values into this chart's own values files.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "factoryai.fullname" . }}-secrets
  labels:
    {{- include "factoryai.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  STORAGE_ACCESS_KEY: {{ .Values.secrets.storageAccessKey | quote }}
  STORAGE_SECRET_KEY: {{ .Values.secrets.storageSecretKey | quote }}
