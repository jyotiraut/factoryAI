[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factoryai"
version = "0.1.0"
description = "Industrial Visual Inspection Platform with End-to-End MLOps"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "FactoryAI Team" }]
keywords = ["mlops", "anomaly-detection", "industrial-inspection", "patchcore"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies grow phase by phase (see docs/ROADMAP.md).
# Heavy ML and infrastructure packages are deliberately kept in optional groups so that
# domain/application development and CI stay fast.
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<26",
    "python-json-logger>=2.0,<4",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# Phase 2 — persistence and object storage
storage = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
]
# Phase 3 — image handling and validation
imaging = [
    "pillow>=10.4,<12",
    "imagehash>=4.3,<5",
    "numpy>=1.26,<2",
]
# Phase 5 — training, tracking and the model plugin layer
ml = [
    "anomalib>=1.1,<2",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "mlflow>=2.16,<3",
    "dvc[s3]>=3.55,<4",
]
# Phase 7 — HTTP surface
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.12,<1",
    "prometheus-client>=0.21,<1",
]
# Phase 8 — auth
auth = [
    "pyjwt[crypto]>=2.9,<3",
    "argon2-cffi>=23.1,<26",
]
# Phase 9 — background processing
worker = [
    "celery[redis]>=5.4,<6",
    "flower>=2.0,<3",
]
# Phase 11 — model monitoring
monitoring = [
    "evidently>=0.4,<1",
]

dev = [
    "ruff>=0.6,<1",
    "black>=24.8,<26",
    "mypy>=1.11,<2",
    "import-linter>=2.0,<3",
    "pre-commit>=3.8,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "pytest-asyncio>=0.24,<1",
    "types-pyyaml>=6.0,<7",
]
test-infra = [
    "testcontainers[postgres,minio]>=4.8,<5",
    "httpx>=0.27,<1",
]

[project.scripts]
factoryai = "factoryai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/factoryai"]

# ---------------------------------------------------------------------------
# Ruff — linting and import ordering
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "services", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # timezone-aware datetimes
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "ANN",       # type annotations
    "D",         # docstrings
    "ARG",       # unused arguments
    "PL",        # pylint subset
    "TRY",       # exception handling anti-patterns
]
ignore = [
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # Any is allowed where justified by a comment
    "TRY003",  # long messages in exceptions are fine for domain errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "PLR2004", "ARG001"]
"pipelines/airflow/**" = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["factoryai"]

# ---------------------------------------------------------------------------
# Black — formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Mypy — strict typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = [
    "anomalib.*",
    "mlflow.*",
    "dvc.*",
    "evidently.*",
    "imagehash.*",
    "testcontainers.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=factoryai",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: fast, no I/O, no containers",
    "integration: requires real infrastructure via testcontainers",
    "e2e: requires the full docker compose stack",
    "slow: takes more than a few seconds",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/factoryai"]

[tool.coverage.report]
# Raised to 85 once the domain layer lands in Phase 1 (see docs/ROADMAP.md).
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# ---------------------------------------------------------------------------
# import-linter — enforces the layering from ADR-0001
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["factoryai"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers (dependencies point inwards)"
type = "layers"
layers = [
    "factoryai.bootstrap",
    "factoryai.infrastructure",
    "factoryai.application",
    "factoryai.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is free of infrastructure and web frameworks"
type = "forbidden"
source_modules = ["factoryai.domain"]
forbidden_modules = [
    "sqlalchemy", "alembic", "psycopg", "boto3",
    "fastapi", "starlette", "uvicorn",
    "mlflow", "anomalib", "torch", "celery", "evidently",
]

[[tool.importlinter.contracts]]
name = "Application is free of web frameworks and concrete infrastructure"
type = "forbidden"
source_modules = ["factoryai.application"]
forbidden_modules = [
    "sqlalchemy", "alembic", "psycopg", "boto3",
    "fastapi", "starlette", "uvicorn",
    "mlflow", "anomalib", "torch", "celery", "evidently",
]

[[tool.importlinter.contracts]]
name = "Shared utilities depend on nothing inside factoryai"
type = "forbidden"
source_modules = ["factoryai.shared"]
forbidden_modules = [
    "factoryai.domain",
    "factoryai.application",
    "factoryai.infrastructure",
    "factoryai.bootstrap",
]
